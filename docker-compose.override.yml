# Geliştirme ortamı için ek ayarlar.
# Bu dosya otomatik olarak docker-compose.yml ile birleştirilir.
# Üretimde kullanmayın.

services:
  next-app:
    build:
      target: dev          # production runner yerine dev stage kullan
    command: sh -c "npx prisma generate && npm run dev"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./public:/app/public
      - ./next.config.ts:/app/next.config.ts
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./postcss.config.mjs:/app/postcss.config.mjs
      - ./tsconfig.json:/app/tsconfig.json
      - ./components.json:/app/components.json
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"        # doğrudan erişim (Caddy bypass)

  postgres:
    ports:
      - "5432:5432"   # DB istemcileri (TablePlus, DBeaver) için

  minio:
    ports:
      - "9000:9000"   # MinIO API
      - "9001:9001"   # MinIO Console → http://localhost:9001

  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: mdf-prisma-studio
    restart: unless-stopped
    command: sh -c "npx prisma generate && npx prisma studio --port 5555 --browser none"
    volumes:
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
    ports:
      - "5555:5555"
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mdf-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mikrodestekfonu.com
      PGADMIN_DEFAULT_PASSWORD: Admin1234!
    ports:
      - "5050:80"
    networks:
      - app-network
